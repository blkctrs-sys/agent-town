<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brenden's Studio</title>
  <meta name="description" content="Brenden's content desks and video packages, ready to read and copy.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../reports/reports.css?v=2">
  <link rel="stylesheet" href="studio.css?v=1">
</head>
<body>
  <header class="top">
    <div>
      <h1>Brenden's Studio</h1>
      <p class="sub">Posts, newsletters and video packages for CitrusCreativity, ready to copy.</p>
    </div>
    <nav class="toplinks"><a class="back" href="../reports/">📚 Reading Room</a> <a class="back" href="../">← Back to town</a></nav>
  </header>

  <main>
    <section class="residents" id="residents" aria-label="Brenden's status"></section>
    <section class="unlock" id="unlock" aria-label="Private files"></section>
    <section class="stats" id="stats" aria-label="Totals"></section>

    <section class="needs" id="needs" aria-label="Needs your input" hidden></section>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-week" aria-controls="view-week" data-view="week">This week</button>
      <button role="tab" id="tab-packages" aria-controls="view-packages" data-view="packages">Video packages</button>
      <button role="tab" id="tab-desks" aria-controls="view-desks" data-view="desks">All desks</button>
      <button role="tab" id="tab-inbox" aria-controls="view-inbox" data-view="inbox">Inbox</button>
    </nav>

    <section id="view-week" role="tabpanel" aria-labelledby="tab-week" class="view"></section>
    <section id="view-packages" role="tabpanel" aria-labelledby="tab-packages" class="view" hidden></section>
    <section id="view-desks" role="tabpanel" aria-labelledby="tab-desks" class="view" hidden></section>
    <section id="view-inbox" role="tabpanel" aria-labelledby="tab-inbox" class="view" hidden></section>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden>
    <button class="close" id="close" aria-label="Close">×</button>
    <div id="reader-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="studio.js?v=1"></script>
</body>
</html>
