<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Town</title>
  <meta name="description" content="A cozy little tech city where my AI agents live and work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="top">
    <h1>Agent Town</h1>
    <p class="clock" id="clock"></p>
  </header>

  <main>
    <div class="stage" id="stage">
      <canvas id="town" width="384" height="216" role="img"
        aria-label="A pixel-art tech city. Each townhouse belongs to an agent, and the residents walk around while they work."></canvas>
      <div class="labels" id="labels" aria-hidden="true"></div>
    </div>
    <p class="hint">Tap a resident or their home to see what they've been up to.</p>

    <section class="roster" aria-label="Residents">
      <h2>Residents</h2>
      <div id="roster" class="roster-list"></div>
      <p class="plots" id="plots"></p>
    </section>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
    <button class="close" id="close" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <script src="town.js?v=2"></script>
</body>
</html>
