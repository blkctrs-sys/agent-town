<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Town Reading Room</title>
  <meta name="description" content="Craig's job reports and Mildred's interview prep, in one place.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reports.css?v=2">
</head>
<body>
  <header class="top">
    <div>
      <h1>Reading Room</h1>
      <p class="sub">Craig's finds and Mildred's prep, side by side.</p>
    </div>
    <a class="back" href="../">← Back to town</a>
  </header>

  <main>
    <section class="residents" id="residents" aria-label="Resident status"></section>

    <section class="unlock" id="unlock" aria-label="Private files"></section>

    <section class="stats" id="stats" aria-label="Totals"></section>

    <section class="chart-card" aria-labelledby="chart-title">
      <div class="chart-head">
        <h2 id="chart-title">Roles found per day</h2>
        <div class="legend" aria-hidden="true">
          <span><i class="sw sw-art"></i>Games &amp; tech</span>
          <span><i class="sw sw-ops"></i>Operations</span>
        </div>
      </div>
      <div class="chart" id="chart"></div>
      <details class="table-view">
        <summary>Show as a table</summary>
        <div id="chart-table"></div>
      </details>
    </section>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-board" aria-controls="view-board" data-view="board">Job board</button>
      <button role="tab" id="tab-reports" aria-controls="view-reports" data-view="reports">Craig's reports</button>
      <button role="tab" id="tab-mildred" aria-controls="view-mildred" data-view="mildred">Mildred's desk</button>
    </nav>

    <section id="view-board" role="tabpanel" aria-labelledby="tab-board" class="view">
      <div class="filters">
        <input type="search" id="q" placeholder="Search title, company, notes…" aria-label="Search roles">
        <div class="chips" role="group" aria-label="Category">
          <button class="chip" data-cat="all">All</button>
          <button class="chip" data-cat="art">Games &amp; tech</button>
          <button class="chip" data-cat="ops">Operations</button>
        </div>
        <select id="range" aria-label="Date range">
          <option value="all">Any date</option>
          <option value="3">Last 3 days</option>
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
        </select>
        <label class="toggle"><input type="checkbox" id="verified"> Verified only</label>
        <label class="toggle private-only"><input type="checkbox" id="prepped"> Has prep pack</label>
      </div>
      <p class="count" id="count"></p>
      <div id="board" class="board"></div>
    </section>

    <section id="view-reports" role="tabpanel" aria-labelledby="tab-reports" class="view" hidden>
      <div id="report-list" class="list"></div>
    </section>

    <section id="view-mildred" role="tabpanel" aria-labelledby="tab-mildred" class="view" hidden>
      <div id="mildred"></div>
    </section>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden>
    <button class="close" id="close" aria-label="Close">×</button>
    <div id="reader-body"></div>
  </aside>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="reports.js?v=2"></script>
</body>
</html>
